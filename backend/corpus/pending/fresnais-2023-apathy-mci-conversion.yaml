- chunk_id: fresnais-2023-apathy-mci-conversion#c1
  text: Apathy is one of the most prevalent neurobehavioral manifestations in mild cognitive impairment (MCI) and is included among the behavioral and psychological symptoms of dementia (BPSD). Studies suggest that the presence of apathy could be associated with increased dementia risk.
- chunk_id: fresnais-2023-apathy-mci-conversion#c2
  text: There was a significant association between apathy and dementia conversion, HR = 1.54; 95% CI, 1.29, 1.84. Subgroup analysis showed a significant association between apathy and progression to AD.
- chunk_id: fresnais-2023-apathy-mci-conversion#c3
  text: Apathy was associated with an increased risk of conversion to AD and all-cause dementia in patients with MCI.
