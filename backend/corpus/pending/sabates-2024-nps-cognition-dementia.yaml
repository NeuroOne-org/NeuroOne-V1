  text: Most people with dementia experience neuropsychiatric symptoms (NPS), including anxiety, depression or disinhibition.
- chunk_id: sabates-2024-nps-cognition-dementia#c2
  text: We found significant associations between NPS, global cognition and cognitive domains, e.g. apathy was associated with global cognitive and memory impairment; dysphoria was associated with worse attention; delusions with executive dysfunction. Increased NPS in people with dementia are associated with worse cognitive performance.
