- chunk_id: chen-2021-mci-guidelines-review#c1
  text: Mild cognitive impairment (MCI) is an important stage between the normal cognitive decline of aging and dementia.
- chunk_id: chen-2021-mci-guidelines-review#c2
  text: Nine guidelines and consensus statements covered the screening and diagnosis of MCI. The evaluation of the documents showed that neuropsychological testing and biomarker assessments were the most common recommendations for the diagnosis of MCI.
- chunk_id: chen-2021-mci-guidelines-review#c3
  text: 'Nine of the 13 guidance documents covered the treatment and management of MCI. The recommendations for the treatment and management were classified into four categories, namely: intervention for risk reduction, pharmacologic interventions, non-pharmacologic interventions, and counseling. Regarding pharmacological interventions, three guidelines recommend no pharmacologic intervention. The use of cholinesterase inhibitors for MCI is contraindicated in three guidance documents, whereas one proposes that cholinesterase inhibitors and memantine should be deprescribed. EHb761®, Chinese herbal decoctions, and Chinese traditional patent medicine are recommended in two documents. A total of seven guidance documents recommend non-pharmacological interventions, including physical activity interventions, cognitive interventions, dietary and nutritional interventions, and acupuncture.'
