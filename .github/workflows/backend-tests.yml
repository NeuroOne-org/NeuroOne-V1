name: Backend tests

on:
  pull_request:
  push:
    branches: [current, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # ADR-007 / AI-02b-8: the Postgres-marked suite (tests/postgres/)
    # exercises real full-text search SQL that SQLite cannot represent, so
    # it needs a real Postgres to run against rather than being skipped.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: neuroone_test
          POSTGRES_USER: neuroone
          POSTGRES_PASSWORD: neuroone_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuroone -d neuroone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg2://neuroone:neuroone_test_only@localhost:5432/neuroone_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: alembic heads
      # Base migration sanity check against a real Postgres, independent of
      # the per-test isolated schemas tests/postgres/conftest.py creates --
      # this catches a migration that fails outright even if no
      # postgres-marked test happens to exercise that exact path.
      #
      # Unlike `alembic heads` above, `upgrade` runs alembic/env.py, which
      # imports app.core.config and constructs a real Settings() -- so every
      # field with no default needs a value here. `python -m pytest` doesn't
      # need this block because tests/conftest.py sets the same test-only
      # values via os.environ.setdefault() before any app module loads.
      - run: alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
          JWT_SECRET_KEY: test-only-jwt-secret
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          # Settings' _validate_auth_safety requires GMAIL_* when
          # OTP_DELIVERY=email (its default); console sidesteps that,
          # exactly as tests/conftest.py does for the same reason.
          OTP_DELIVERY: console
      - run: python -m pytest
