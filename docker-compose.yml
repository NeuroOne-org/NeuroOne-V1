services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neuroone
      POSTGRES_USER: neuroone
      POSTGRES_PASSWORD: neuroone_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroone -d neuroone"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - neuroone_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://neuroone:neuroone_dev_only@db:5432/neuroone
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-local-development-secret}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      SQL_ECHO: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  neuroone_postgres_data:
