# Shared by the one-shot migrate job and the API so the two never disagree on
# which database or settings they run against.
x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg2://neuroone:neuroone_dev_only@db:5432/neuroone
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-local-development-secret}
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 30
  SQL_ECHO: "false"
  # This is a local stack, so OTP codes go to `docker compose logs api` by
  # default. Settings refuses to start with OTP_DELIVERY=email unless both
  # GMAIL_* values are set in the host environment.
  OTP_DELIVERY: ${OTP_DELIVERY:-console}
  GMAIL_ADDRESS: ${GMAIL_ADDRESS:-}
  GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
  SCAN_STORAGE_DIR: /data/scans
  # AI seams, mock by default. Set them in the host environment (or a root
  # .env) to run live, e.g. AI_PROVIDER=live-llm AI_STAGING_PROVIDER=live-vision.
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  AI_RETRIEVAL_PROVIDER: ${AI_RETRIEVAL_PROVIDER:-mock}
  AI_STAGING_PROVIDER: ${AI_STAGING_PROVIDER:-mock}
  AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-https://api.groq.com/openai/v1}
  AI_LLM_MODEL: ${AI_LLM_MODEL:-openai/gpt-oss-120b}
  AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
  AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen/qwen3.8-27b}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neuroone
      POSTGRES_USER: neuroone
      POSTGRES_PASSWORD: neuroone_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroone -d neuroone"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - neuroone_postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Scan bytes are source data that cannot be regenerated (ADR-006).
      - neuroone_scan_data:/data/scans

  frontend:
    # Proxies /api/v1 to the api service (next.config.mjs rewrites), so the
    # browser talks to one origin and the SameSite=Strict cookie just works.
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  neuroone_postgres_data:
  neuroone_scan_data:
